frontend FE-http
  mode http
  bind ipv4@:80
  bind ipv6@:80

  # set X-Real-IP header required for Anubis
  http-request set-header X-Real-IP "%[src]"

  acl noredirects path_beg /.well-known/acme-challenge/
  acl noredirects path_beg /fonts/ /images/ /css/

  redirect prefix https://jausoft.com if !noredirects { req.hdr(host) -m reg ^jausoft\.com(?::.*)?$ }
  redirect prefix https://jausoft.com if !noredirects { req.hdr(host) -m reg ^www.jausoft\.com(?::.*)?$ }
  # redirect prefix https://jausoft.com if !noredirects

  use_backend BE-jausoft-http if noredirects

  # redirect HTTP to HTTPS
  #http-request redirect scheme https code 301 unless { ssl_fc }

frontend FE-https
  mode http
  # ssl offloading on port 443 using a certificate from /etc/haproxy/ssl/ directory
  bind ipv4@:443 ssl crt /etc/letsencrypt/live/jausoft.com/fullchain.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2 no-tls-tickets
  bind ipv6@:443 ssl crt /etc/letsencrypt/live/jausoft.com/fullchain.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2 no-tls-tickets

  # set X-Real-IP header required for Anubis
  http-request set-header X-Real-IP "%[src]"
  # set TLS SNI name for Anubis
  http-request set-header X-TLS-SNI-Name %[ssl_fc_sni]

  # add HSTS header
  http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

  acl certbot path_beg /.well-known/acme-challenge/

  redirect prefix https://jausoft.com if !certbot { req.hdr(host) -m reg ^www.jausoft\.com(?::.*)?$ }

  use_backend BE-jausoft-https if certbot

  # route to Anubis backend by default
  default_backend BE-anubis-jausoft

backend BE-jausoft-http
  mode http
  timeout queue 20s
  server jausoft-http 127.0.0.1:3000 check maxconn 400

backend BE-jausoft-https
  mode http
  timeout queue 20s
  server jausoft-https 127.0.0.1:3001 check maxconn 400

backend BE-anubis-jausoft
  mode http
  fullconn 5000
  timeout queue 20s
  # /cgit/ gets a lower priority (higher class #)
  acl is_cgit path_beg /cgit/
  http-request set-priority-class int(1) if !is_cgit
  http-request set-priority-class int(2) if is_cgit
  #server anubis-jausoft unix@/run/anubis/apache2/default.sock check
  server anubis-jausoft 127.0.0.1:8923 check maxconn 5000

